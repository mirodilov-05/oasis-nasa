<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TerraShift</title>
  <meta name="description" content="Compare crop rotations for your field with 35 years of NASA climate data.">
  <link rel="stylesheet" href="/vendor/leaflet.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/intro.css?v=4">
  <script>
    /* Decide before first paint whether the cinematic intro runs (first visit, or ?intro=1). */
    (function () {
      var q = new URLSearchParams(location.search), seen = false;
      try { seen = localStorage.getItem("ts_intro_seen") === "1"; } catch (e) { /* storage blocked */ }
      var show = q.get("intro") === "1" || (!seen && !q.has("lat") && q.get("intro") !== "0");
      window.__introShow = show;
      if (show) document.documentElement.classList.add("intro-on");
    })();
  </script>
</head>
<body data-page="home" data-title="page_title_home">
  <div id="intro" class="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title" aria-describedby="intro-line">
    <canvas id="intro-stars" class="intro-layer" aria-hidden="true"></canvas>
    <div id="intro-gl" class="intro-layer" aria-hidden="true"></div>
    <canvas id="intro-fields" class="intro-layer intro-fields" aria-hidden="true"></canvas>
    <div class="intro-haze" aria-hidden="true"></div>
    <div class="intro-vignette" aria-hidden="true"></div>
    <div class="intro-copy">
      <p id="intro-kicker" class="intro-kicker"></p>
      <h1 id="intro-title" class="intro-title">TerraShift</h1>
      <p id="intro-line" class="intro-line"></p>
      <button type="button" id="intro-enter" class="btn primary intro-enter" hidden></button>
    </div>
    <p id="intro-hud" class="intro-hud" aria-hidden="true"></p>
    <button type="button" id="intro-skip" class="btn ghost intro-skip"></button>
    <div class="intro-progress" aria-hidden="true"><span></span></div>
  </div>
  <a class="skip-link" href="#main-content" data-t="skip_to_content"></a>
  <header class="top">
    <a class="brand" href="/" aria-label="TerraShift">
      <span class="logo" aria-hidden="true"></span>
      <span><strong>TerraShift</strong><span class="sub" data-t="tagline"></span></span>
    </a>
    <nav class="site-nav" data-t-aria="main_nav_label">
      <a href="/" data-page-link="home" data-t="nav_home"></a>
      <a href="/rotations.html" data-page-link="rotations" data-t="nav_rotations"></a>
      <a href="/climate.html" data-page-link="climate" data-t="nav_climate"></a>
      <a href="/crops.html" data-page-link="crops" data-t="nav_crops"></a>
      <a href="/current.html" data-page-link="current" data-t="nav_now"></a>
      <a href="/sources.html" data-page-link="sources" data-t="nav_sources"></a>
    </nav>
    <div class="top-actions">
      <div id="chips" class="chips" aria-live="polite"></div>
      <div class="seg" role="group" data-t-aria="language_group">
        <button type="button" data-lang="uz">UZ</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <a class="btn ghost source-link" href="/sources.html" data-t="sources_btn"></a>
      <a class="btn ghost" href="/?intro=1" id="replay-intro" data-t="replay_intro"></a>
    </div>
  </header>
  <div id="warnings" class="warnings" aria-live="polite"></div>
  <p id="analysis-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>

  <main class="layout home-layout" id="main-content">
    <aside class="side">
      <section class="card">
        <h2 data-t="field_title"></h2>
        <p class="hint" data-t="field_hint"></p>
        <div id="map-workspace" class="map-workspace">
          <div id="map" class="map" role="application" data-t-aria="map_label"></div>
          <div id="map-tools" class="map-tools">
            <form class="field-search" id="place-form" role="search" autocomplete="off">
              <label class="field" for="place-search"><span data-t="place_search_label"></span></label>
              <div class="search-row">
                <input id="place-search" type="search" enterkeyhint="search" data-t-placeholder="place_search_placeholder"
                  aria-autocomplete="list" aria-controls="place-results" aria-expanded="false">
                <button type="submit" id="place-go" class="btn primary" data-t="place_search_button"></button>
              </div>
              <p class="hint" data-t="place_search_hint"></p>
              <ul id="place-results" class="place-results" role="listbox" data-t-aria="place_results_label" hidden></ul>
              <p id="place-search-status" class="hint" role="status" aria-live="polite" aria-atomic="true"></p>
              <p id="place-info" class="hint place-info" aria-live="polite"></p>
              <a class="search-attribution" href="https://nominatim.openstreetmap.org/" target="_blank" rel="noopener" data-t="place_search_attribution"></a>
            </form>
            <div class="row wrap">
              <button type="button" id="locate" class="btn primary" data-t="locate"></button>
              <span id="coords" class="mono muted"></span>
            </div>
            <p id="locate-msg" class="hint warn-text" hidden></p>
            <label class="field"><span data-t="map_layer"></span><select id="layer"></select></label>
            <label class="field" id="opacity-row" hidden>
              <span data-t="layer_opacity"></span>
              <input type="range" id="opacity" min="20" max="100" value="70">
            </label>
          </div>
        </div>
        <button type="button" id="open-map" class="btn ghost" data-t="map_fullscreen_open"></button>
      </section>
      <section class="card">
        <h2 data-t="passport_title"></h2>
        <label class="field"><span data-t="current_rotation"></span><select id="current"></select></label>
        <div id="builder" class="builder" hidden>
          <p class="hint" data-t="builder_hint"></p>
          <div id="builder-years"></div>
          <div class="row wrap">
            <button type="button" id="add-year" class="btn ghost" data-t="add_year"></button>
            <button type="button" id="remove-year" class="btn ghost" data-t="remove_year"></button>
          </div>
        </div>
        <label class="field"><span data-t="irrigation_method"></span><select id="irrigation"></select></label>
        <label class="field"><span data-t="soil_type"></span><select id="soil"></select></label>
        <p id="soil-note" class="hint"></p>
      </section>
      <section class="card">
        <h2 data-t="priorities_title"></h2>
        <p class="hint" data-t="priorities_hint"></p>
        <div id="sliders"></div>
      </section>
    </aside>
    <section class="content">
      <section id="suit-card" class="card suit" aria-live="polite" hidden></section>
      <section class="card verdict" aria-labelledby="verdict">
        <div class="eyebrow" data-t="verdict_eyebrow"></div>
        <h1 id="verdict" data-t="loading"></h1>
        <p id="verdict-sub" class="lead"></p>
        <ul id="advice-top" class="advice"></ul>
        <a class="btn primary" href="/rotations.html" data-t="full_comparison"></a>
      </section>
      <section id="week-card" class="card week" aria-labelledby="week-plan-title" hidden></section>
      <section id="region-card" class="card region" aria-labelledby="region-title" hidden></section>
    </section>
  </main>

  <dialog id="map-dialog" class="fullscreen-map-dialog" aria-labelledby="map-dialog-title">
    <div class="dialog-head">
      <h2 id="map-dialog-title" data-t="map_fullscreen_title"></h2>
      <button type="button" id="close-map" class="btn ghost" data-t="map_fullscreen_close" autofocus></button>
    </div>
    <div id="fullscreen-map-host" class="fullscreen-map-host"></div>
  </dialog>

  <script src="/vendor/leaflet.js"></script>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
  <script>
    /* Intro controller: works without WebGL or the intro module, so the page can always be reached. */
    (function () {
      var el = document.getElementById("intro");
      var st = {};
      try { st = JSON.parse(localStorage.getItem("terrashift") || "{}") || {}; } catch (e) { /* ignore */ }
      var num = function (v, d) { return typeof v === "number" && isFinite(v) ? v : d; };
      var ctl = window.__intro = {
        active: !!window.__introShow, started: false, hooks: [],
        lang: ["uz", "en", "ru"].indexOf(st.lang) >= 0 ? st.lang : "uz",
        target: { lat: num(st.lat, 41.3), lon: num(st.lon, 69.2) },
        onFinish: function (fn) { this.hooks.push(fn); },
        fallback: function () { ctl.finish(); },
      };
      if (!ctl.active) { el.remove(); return; }
      var app = [document.querySelector(".skip-link"), document.querySelector("header.top"),
                 document.getElementById("warnings"), document.getElementById("main-content")];
      app.forEach(function (n) { if (n) n.inert = true; });
      var skip = document.getElementById("intro-skip");
      skip.textContent = { uz: "Kirishni o'tkazib yuborish", en: "Skip intro", ru: "Пропустить интро" }[ctl.lang];
      var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      ctl.finish = function () {
        if (!ctl.active) return;
        ctl.active = false;
        try { localStorage.setItem("ts_intro_seen", "1"); } catch (e) { /* ignore */ }
        app.forEach(function (n) { if (n) n.inert = false; });
        el.classList.add("intro-out");
        document.removeEventListener("keydown", onKey);
        var q = new URLSearchParams(location.search);
        if (q.has("intro")) { q.delete("intro"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "") + location.hash); }
        setTimeout(function () {
          ctl.hooks.forEach(function (h) { try { h(); } catch (e) { /* ignore */ } });
          el.remove();
          document.documentElement.classList.remove("intro-on");
          window.dispatchEvent(new Event("resize")); // the map re-measures once the scrollbar is back
          var s = document.getElementById("place-search");
          if (s) s.focus({ preventScroll: true });
        }, reduced ? 0 : 800);
      };
      function onKey(e) { if (e.key === "Escape") ctl.finish(); }
      document.addEventListener("keydown", onKey);
      skip.addEventListener("click", ctl.finish);
      document.getElementById("intro-enter").addEventListener("click", ctl.finish);
      skip.focus({ preventScroll: true });
      // If the module never starts (blocked script, old browser), do not trap the visitor.
      setTimeout(function () { if (ctl.active && !ctl.started) ctl.finish(); }, 8000);
    })();
  </script>
  <script type="module" src="/intro.js?v=4"></script>
</body>
</html>
